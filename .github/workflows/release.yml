name: Release

# Builds the signed APK and publishes a GitHub release. Run it by hand from the Actions tab
# once the four signing secrets are added (Settings → Secrets and variables → Actions):
# SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: version
        run: |
          v=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::Release v$v already exists. Raise versionName and versionCode in app/build.gradle.kts first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up the signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/segno-release.jks"

      - name: Build the signed APK
        env:
          SEGNO_KEYSTORE_FILE: ${{ runner.temp }}/segno-release.jks
          SEGNO_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SEGNO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SEGNO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Check the signature and name the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key. Check the signing secrets."
            exit 1
          fi
          cp "$apk" "Segno-${{ steps.version.outputs.version }}.apk"
          ls -l Segno-*.apk

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="## $v" '$0 == v {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $v' section."
            exit 1
          fi
          {
            echo
            echo "Download **Segno-$v.apk** below and open it on your phone. The README explains how to install it."
          } >> notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" "Segno-$v.apk" --title "Segno $v" --notes-file notes.md
