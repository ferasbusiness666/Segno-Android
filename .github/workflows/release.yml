name: Release

# Builds the signed APK and publishes a GitHub release. Run it by hand from the Actions tab
# once the four signing secrets are added (Settings → Secrets and variables → Actions):
# SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: version
        run: |
          v=$(grep -m1 '^val appVersion = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if ! echo "$v" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::appVersion in app/build.gradle.kts should look like 1.2.3, not '$v'."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::Release v$v already exists. Raise appVersion in app/build.gradle.kts first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up the signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/segno-release.jks"

      - name: Build the signed APK
        env:
          SEGNO_KEYSTORE_FILE: ${{ runner.temp }}/segno-release.jks
          SEGNO_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SEGNO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SEGNO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Check the signature and name the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key. Check the signing secrets."
            exit 1
          fi
          cp "$apk" "Segno-${{ steps.version.outputs.version }}.apk"
          # The same APK under a name that never changes, for the website's Download button
          # (releases/latest/download/Segno.apk). The app itself updates from Segno-<version>.apk.
          cp "$apk" Segno.apk
          ls -l Segno-*.apk Segno.apk

      # The app installs updates named Segno-<version>.apk, and Android only takes a higher
      # versionCode, so check both against the last release.
      - name: Check the version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          badging=$("$aapt2" dump badging "Segno-$v.apk" | head -1)
          echo "$badging"
          code=$(echo "$badging" | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
          name=$(echo "$badging" | sed -E "s/.*versionName='([^']+)'.*/\1/")
          IFS=. read -r major minor patch <<< "$v"
          want=$(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
          if [ "$name" != "$v" ] || [ "$code" != "$want" ]; then
            echo "::error::The APK says $name ($code), expected $v ($want)."
            exit 1
          fi
          last=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -n "$last" ]; then
            mkdir -p last
            if gh release download "$last" --pattern 'Segno-*.apk' --dir last; then
              prev=$("$aapt2" dump badging last/Segno-*.apk | head -1 | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
              echo "Last release $last has versionCode $prev; this one has $code."
              if [ "$code" -le "$prev" ]; then
                echo "::error::versionCode $code isn't higher than $prev in $last, so phones wouldn't take this update."
                exit 1
              fi
            fi
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="## $v" '$0 == v {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $v' section."
            exit 1
          fi
          {
            echo
            echo "Download **Segno-$v.apk** below and open it on your phone. The README explains how to install it."
          } >> notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" "Segno-$v.apk" Segno.apk --title "Segno $v" --notes-file notes.md
