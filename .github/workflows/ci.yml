name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs, run unit tests and lint
        run: ./gradlew --stacktrace --continue assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/segno-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk out/segno-release-unsigned-key.apk 2>/dev/null || true
          {
            echo "commit: $GITHUB_SHA"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "== APK sizes (bytes)"
            ls -l out/*.apk 2>/dev/null | awk '{print $5, $9}'
            echo
            echo "== Unit tests"
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] && echo "$(basename "$f" .xml | sed 's/^TEST-//') $(grep -o '<testsuite [^>]*' "$f" | grep -o 'tests="[0-9]*"\|failures="[0-9]*"\|errors="[0-9]*"' | tr '\n' ' ')"
            done
            echo
            echo "== Lint"
            grep -o '<issue [^>]*severity="[A-Za-z]*"[^>]*id="[^"]*"' app/build/reports/lint-results-debug.xml 2>/dev/null | sed -E 's/.*id="([^"]*)".*/\1/' | sort | uniq -c | sort -rn || echo "no lint report"
          } > out/build.txt
          mkdir -p out/reports
          cp -r app/build/reports/lint-results-debug.txt out/reports/ 2>/dev/null || true
          cp -r app/build/test-results/testDebugUnitTest out/reports/unit-tests 2>/dev/null || true
          cat out/build.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: out
          retention-days: 3

  emulator:
    name: Emulator API ${{ matrix.api }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
            profile: Nexus 5
          - api: 34
            target: google_apis
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build-out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QEMU_AUDIO_DRV: none
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 ci/emulator_check.py build-out/segno-debug.apk emulator-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.api }}
          path: emulator-out
          retention-days: 3

  publish:
    name: Push outputs to ci-out
    needs: [build, emulator]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Push a fresh orphan commit to ci-out
        run: |
          mkdir -p ci-out
          cp -r artifacts/build/. ci-out/ 2>/dev/null || true
          for d in artifacts/emulator-*; do
            [ -d "$d" ] && cp -r "$d" "ci-out/$(basename "$d")"
          done
          cd ci-out
          echo "Outputs of CI run ${{ github.run_id }} for ${{ github.sha }}" > README.md
          git init -q -b ci-out
          git add -A
          git -c user.name="Feras" -c user.email="250983428+ferasbusiness666@users.noreply.github.com" commit -qm "CI outputs for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-out
          # A leftover branch from setting up CI; gone once deleted.
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete ci-probe 2>/dev/null || true
