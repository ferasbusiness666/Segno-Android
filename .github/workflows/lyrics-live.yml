name: Lyrics live check

# Looks up the hard songs in app/src/test/resources/tricky-songs.json (the same list desktop
# Segno uses) for real, through the app's own lyrics code, and shows which place each answer came
# from. Run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Ask for the tricky songs
        env:
          SEGNO_LIVE: "1"
        run: ./gradlew --stacktrace :app:testDebugUnitTest --tests '*LyricsLiveTest*' --rerun

      - name: What each song got
        if: always()
        run: |
          cat app/build/lyrics-live.txt 2>/dev/null || echo "No results file."
          cat app/build/lyrics-live.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
